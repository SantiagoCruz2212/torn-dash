<div class="w-full rounded border border-surface-border bg-surface-dark relative overflow-hidden flex items-center justify-between shadow-md group"
     [style.min-height]="height">

  <!-- Grid pattern background -->
  <div class="absolute inset-0 opacity-10 pointer-events-none"
       style="background-image: linear-gradient(#2a3830 1px, transparent 1px), linear-gradient(90deg, #2a3830 1px, transparent 1px); background-size: 20px 20px;">
  </div>

  <!-- Accent gradient -->
  <div class="absolute right-0 top-0 bottom-0 w-1/3 bg-gradient-to-l from-primary/5 to-transparent skew-x-12 origin-bottom pointer-events-none">
  </div>

  <!-- Ad label -->
  <div class="absolute top-2 right-2 z-20">
    <span class="text-[9px] text-text-muted border border-surface-border px-1.5 py-0.5 rounded uppercase bg-black/40">
      Ad
    </span>
  </div>

  <!-- Google AdSense -->
  <div *ngIf="provider === 'adsense'" class="w-full relative z-10 px-6 py-4" #adContainer>
    <ins class="adsbygoogle"
         style="display:block"
         [attr.data-ad-client]="client"
         [attr.data-ad-slot]="slot"
         [attr.data-ad-format]="format"
         [attr.data-full-width-responsive]="responsive">
    </ins>
  </div>

  <!-- Adsterra -->
  <div *ngIf="provider === 'adsterra'" class="w-full relative z-10 px-6 py-4" #adContainer>
    <div [id]="'container-' + scriptId"></div>
  </div>

  <!-- PropellerAds -->
  <div *ngIf="provider === 'propellerads'" class="w-full relative z-10 px-6 py-4" #adContainer>
    <div [id]="'propeller-' + scriptId"></div>
  </div>

  <!-- Fallback/Demo content -->
  <div *ngIf="!client && !scriptId" class="relative z-10 flex flex-col justify-center h-full px-6 w-full">
    <div class="flex items-center gap-2 mb-1">
      <span class="px-1.5 py-0.5 rounded bg-primary/10 text-primary text-[10px] font-bold uppercase tracking-wider border border-primary/20">
        System Update
      </span>
    </div>
    <h3 class="text-white font-display font-bold text-lg tracking-tight flex items-center gap-2">
      NEURAL LINK V.3.2
      <span class="text-text-muted font-normal text-sm hidden sm:inline-block"> // Enhanced Reaction Times</span>
    </h3>
    <span class="text-xs text-text-muted mt-0.5">
      Upgrade your combat stats instantly. Available at the Cyber-Doc.
    </span>
  </div>
</div>
