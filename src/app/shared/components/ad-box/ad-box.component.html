<div class="flex-1 rounded border border-surface-border bg-[#121614] flex flex-col relative overflow-hidden group"
     [style.min-height]="minHeight">

  <!-- Ad label -->
  <div class="absolute top-2 right-2 z-20">
    <span class="text-[9px] text-text-muted border border-surface-border px-1.5 py-0.5 rounded uppercase bg-black/50 backdrop-blur-sm">
      Ad
    </span>
  </div>

  <!-- Google AdSense -->
  <div *ngIf="provider === 'adsense'" class="w-full h-full flex flex-col relative z-10" #adContainer>
    <ins class="adsbygoogle"
         style="display:block; width:100%; height:100%;"
         [attr.data-ad-client]="client"
         [attr.data-ad-slot]="slot"
         [attr.data-ad-format]="format"
         [attr.data-full-width-responsive]="responsive">
    </ins>
  </div>

  <!-- Adsterra -->
  <div *ngIf="provider === 'adsterra'" class="w-full h-full relative z-10" #adContainer>
    <div [id]="'container-' + scriptId" class="w-full h-full"></div>
  </div>

  <!-- PropellerAds -->
  <div *ngIf="provider === 'propellerads'" class="w-full h-full relative z-10" #adContainer>
    <div [id]="'propeller-' + scriptId" class="w-full h-full"></div>
  </div>

  <!-- Fallback/Demo content -->
  <div *ngIf="!client && !scriptId" class="w-full h-full flex flex-col">
    <div class="h-36 bg-surface-border/20 relative w-full overflow-hidden flex items-center justify-center border-b border-surface-border">
      <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/diagmonds-light.png')] opacity-10 pointer-events-none"></div>
      <span class="material-symbols-outlined text-5xl text-accent animate-pulse">local_fire_department</span>
      <div class="absolute bottom-0 w-full h-1 bg-gradient-to-r from-transparent via-accent to-transparent"></div>
    </div>
    <div class="p-5 flex flex-col flex-1 relative z-10 bg-surface-dark">
      <h3 class="text-lg font-bold text-white leading-tight mb-1">BURN OUT?</h3>
      <p class="text-sm font-bold text-accent mb-3">GET FIRED UP!</p>
      <p class="text-xs text-text-muted mb-6 leading-relaxed">
        The new "Inferno" energy drink gives you +25 Nerve instantly. Warning: May cause mild internal combustion.
      </p>
      <div class="mt-auto">
        <div class="flex justify-between items-end mb-3">
          <span class="text-xs text-text-muted line-through">$150</span>
          <span class="text-xl font-mono font-bold text-white">$99 <span class="text-xs font-sans text-primary font-normal">/ can</span></span>
        </div>
        <button class="w-full py-2.5 rounded border border-accent text-accent hover:bg-accent hover:text-white font-bold text-xs uppercase transition-all shadow-[0_0_10px_rgba(242,92,13,0.1)] hover:shadow-[0_0_15px_rgba(242,92,13,0.4)]">
          Order Bulk
        </button>
      </div>
    </div>
  </div>
</div>
