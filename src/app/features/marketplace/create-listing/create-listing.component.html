<div class="min-h-screen bg-gray-900 py-8 px-4 sm:px-6 lg:px-8">
  <div class="max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-white mb-8">Create New Listing</h1>

    <div class="bg-gray-800 rounded-lg p-6">
      <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="relative">
          <label class="block text-sm font-medium text-gray-300 mb-2">Search Torn Item</label>
          <input type="text" [(ngModel)]="searchQuery" [ngModelOptions]="{standalone: true}" (ngModelChange)="onSearchItems()" placeholder="Type to search items..." class="w-full px-4 py-2 bg-gray-700 text-white border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
          <div *ngIf="filteredItems.length > 0" class="absolute z-10 w-full mt-1 bg-gray-700 border border-gray-600 rounded-md shadow-lg max-h-60 overflow-y-auto">
            <div *ngFor="let item of filteredItems" (click)="selectItem(item)" class="px-4 py-2 hover:bg-gray-600 cursor-pointer text-white">{{ item.name }}</div>
          </div>
        </div>

        <div *ngIf="selectedItem" class="bg-gray-700 rounded-md p-4">
          <h3 class="text-white font-medium mb-2">Selected: {{ selectedItem.name }}</h3>
          <p class="text-sm text-gray-400">Market Value: ${{ formatPrice(selectedItem.market_value) }}</p>
        </div>

        <div>
          <label for="quantity" class="block text-sm font-medium text-gray-300 mb-2">Quantity</label>
          <input id="quantity" formControlName="quantity" type="number" min="1" class="w-full px-4 py-2 bg-gray-700 text-white border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label for="pricePerUnit" class="block text-sm font-medium text-gray-300 mb-2">Price Per Unit ($)</label>
          <input id="pricePerUnit" formControlName="pricePerUnit" type="number" min="0" class="w-full px-4 py-2 bg-gray-700 text-white border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div class="bg-green-900 bg-opacity-30 border border-green-700 rounded-md p-4">
          <div class="flex justify-between items-center">
            <span class="text-gray-300">Total Price:</span>
            <span class="text-2xl font-bold text-green-400">${{ formatPrice(calculateTotal()) }}</span>
          </div>
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-gray-300 mb-2">Description (Optional)</label>
          <textarea id="description" formControlName="description" rows="3" class="w-full px-4 py-2 bg-gray-700 text-white border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Add details..."></textarea>
        </div>

        <div *ngIf="successMessage" class="bg-green-900 bg-opacity-50 text-green-300 rounded-md p-4">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="bg-red-900 bg-opacity-50 text-red-300 rounded-md p-4">{{ errorMessage }}</div>

        <div class="flex gap-3">
          <button type="submit" [disabled]="createForm.invalid || isLoading" class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-md hover:bg-blue-700 disabled:opacity-50">
            <span *ngIf="!isLoading">Create Listing</span>
            <span *ngIf="isLoading">Creating...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
