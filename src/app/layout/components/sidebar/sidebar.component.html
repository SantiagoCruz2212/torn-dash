<!-- Desktop Sidebar -->
<aside class="hidden lg:flex flex-col w-64 h-screen border-r border-surface-border bg-surface-dark fixed left-0 top-0 z-40">
  <!-- Logo -->
  <div class="p-6 border-b border-surface-border flex items-center gap-3">
    <div class="size-10 rounded bg-primary flex items-center justify-center shadow-[0_0_15px_rgba(13,242,89,0.3)]">
      <span class="material-symbols-outlined text-black font-bold">terminal</span>
    </div>
    <div class="flex flex-col">
      <h1 class="font-bold text-xl tracking-wider leading-none">TORN DASH</h1>
      <span class="text-xs text-primary font-mono mt-1">SYS.VER.0.1</span>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-1">
    <ng-container *ngFor="let item of navItems">
      <!-- Item con children (expandible) -->
      <div *ngIf="item.children" class="nav-item-container">
        <button
          (click)="toggleItem(item)"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-muted hover:text-white hover:bg-white/5 transition-colors group border border-transparent w-full">
          <span class="material-symbols-outlined group-hover:text-primary transition-colors">
            {{ item.icon }}
          </span>
          <span class="font-medium flex-1 text-left">{{ item.label }}</span>
          <span class="material-symbols-outlined text-sm transition-transform" [class.rotate-180]="item.expanded">
            expand_more
          </span>
        </button>

        <!-- Submenu -->
        <div class="submenu" [class.expanded]="item.expanded">
          <a *ngFor="let child of item.children"
             [routerLink]="child.route"
             routerLinkActive="bg-primary/10 text-primary border-primary/20"
             class="flex items-center gap-3 px-4 py-2 pl-12 rounded-lg text-text-muted hover:text-white hover:bg-white/5 transition-colors group border border-transparent">
            <span class="material-symbols-outlined text-sm group-hover:text-primary group-[.bg-primary\/10]:text-primary transition-colors">
              {{ child.icon }}
            </span>
            <span class="font-medium text-sm">{{ child.label }}</span>
          </a>
        </div>
      </div>

      <!-- Item normal (sin children) -->
      <a *ngIf="!item.children"
         [routerLink]="item.route"
         routerLinkActive="bg-primary/10 text-primary border-primary/20"
         [routerLinkActiveOptions]="{exact: item.route === '/'}"
         class="flex items-center gap-3 px-4 py-3 rounded-lg text-text-muted hover:text-white hover:bg-white/5 transition-colors group border border-transparent"
         (click)="onNavClick(item)">
        <span class="material-symbols-outlined group-hover:text-primary group-[.bg-primary\/10]:text-primary transition-colors">
          {{ item.icon }}
        </span>
        <span class="font-medium">{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

  <!-- User Info -->
  <div class="p-4 border-t border-surface-border">
    <div class="flex items-center gap-3 px-2 py-2">
      <div class="size-8 rounded-full bg-primary/20 ring-2 ring-primary/30 flex items-center justify-center">
        <span class="material-symbols-outlined text-primary text-sm">person</span>
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-bold text-white">{{ userName }}</span>
        <span class="text-xs text-text-muted">Level {{ userLevel }}</span>
      </div>
    </div>
  </div>
</aside>

<!-- Mobile Header -->
<div class="lg:hidden flex items-center justify-between p-4 border-b border-surface-border bg-surface-dark w-full fixed z-50">
  <div class="flex items-center gap-3">
    <div class="bg-primary/20 p-1.5 rounded text-primary">
      <span class="material-symbols-outlined">terminal</span>
    </div>
    <span class="font-bold text-lg tracking-wider">TORN DASH</span>
  </div>
  <button class="text-white">
    <span class="material-symbols-outlined">menu</span>
  </button>
</div>
